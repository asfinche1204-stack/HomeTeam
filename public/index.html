const hashTab = (location.hash || '').replace('#', ''); if (['week', 'team', 'workouts', 'home', 'dates'].includes(hashTab)) S.tab = hashTab;
handleLink(location.hash);
Scene.build();
if (/[?&]og\b/.test(location.search)) { document.documentElement.classList.add('og'); Welcome.show('og'); Welcome.demo(2); }
setSync(); render();
Store.init();
if (location.hash === '#welcome') setTimeout(() => Welcome.show(S.locked ? 'login' : 'preview'), 50);
/* ---------- self-update: the server stamps a build id into this page; when the server's id
   changes (new deploy), reload so phones and open tabs never sit on an old copy. ---------- */
var APP_BUILD = '__HT_BUILD__';
var Updater = {
  pending: false, checking: false, last: 0,
  async check(force) {
    if (this.checking || APP_BUILD.startsWith('__')) return;
    if (!force && Date.now() - this.last < 60000) return;
    this.checking = true; this.last = Date.now();
    try {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
      const r = await fetch('/healthz?t=' + Date.now(), { cache: 'no-store' }); const j = await r.json();
      if (j.build && j.build !== APP_BUILD) { this.pending = true; this.apply(); } else if (force) toast('You’re on the latest version');
    } catch (e) { if (force) toast('Couldn’t reach the server'); }
    this.checking = false;
  },
  apply() {
    // never yank the page while someone is typing in a sheet; show a bar instead
    if (SHEET) { this.banner(); return; }
    this.reload();
  },
  banner() {
    if (document.getElementById('updBar')) return;
    const b = document.createElement('button'); b.id = 'updBar'; b.type = 'button';
    b.textContent = 'New version ready · tap to update';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;border:0;border-radius:999px;padding:10px 16px;font:600 14px/1 inherit;background:#0f766e;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer';
    b.onclick = () => this.reload();
    document.body.appendChild(b);
  },
  async reload(hard) {
    try {
      if (hard && navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
      if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  }
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {}); });
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', e => { const d = e.data || {}; if (d.t === 'open' && d.url) { const h = d.url.slice(d.url.indexOf('#')); if (!handleLink(h)) { const t = h.replace('#', ''); if (['week', 'team', 'workouts', 'home', 'dates'].includes(t)) { S.tab = t; render(); } } } });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) Updater.apply(); hadController = true; });
}
if (/[?&]v=\d/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
setTimeout(() => Updater.check(), 1500);
setInterval(() => Updater.check(), 30 * 60000);
window.addEventListener('pageshow', e => { if (e.persisted) Updater.check(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Updater.check(); if (S.loaded) { Store.refresh(); if (S.tab === 'week') Cal.load(S.viewWeek, true); } } });
window.addEventListener('hashchange', () => { if (location.hash === '#welcome') { Welcome.show(S.locked ? 'login' : 'preview'); return; } if (handleLink(location.hash)) return; const t = (location.hash || '').replace('#', ''); if (['week', 'team', 'workouts', 'home', 'dates'].includes(t)) { S.tab = t; render(); } });
</script>
