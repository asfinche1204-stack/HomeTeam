<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Team</title>
<meta name="description" content="The two of us, one board: this week's workouts, dinners, date and house projects, with points, a weekly wager and a shared pot so plans actually happen.">
<meta property="og:type" content="website">
<meta property="og:title" content="Home Team">
<meta property="og:description" content="Our shared board for the week, with points, a weekly wager and a pot we fill together.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Home Team">
<meta name="twitter:description" content="Our shared board for the week, with points, a weekly wager and a pot we fill together.">
<meta name="twitter:image" content="/og.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1222" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Team">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette: navy (Alan) and teal (her) on a cool mesh ground; glass cards, a gradient hero, a floating tab bar.
     Layout: single column phone app to 600px, bottom sheets for editing, one Team page for points, wager, pot and the ledger. */
  --bg:#EEF2F7; --mesh1:rgba(28,55,100,.10); --mesh2:rgba(15,139,139,.12);
  --surface:rgba(255,255,255,.74); --surface-solid:#FFFFFF; --surface-2:rgba(20,33,58,.06); --ink:#121C30; --muted:#5A6880; --line:rgba(20,33,58,.09); --line-strong:rgba(20,33,58,.16);
  --a:#1C3764; --a-soft:rgba(28,55,100,.12); --a-ink:#1C3764;
  --b:#0F8B8B; --b-soft:rgba(15,139,139,.13); --b-ink:#0B6F6F;
  --grad:linear-gradient(135deg,#1C3764 0%,#14607A 55%,#0F8B8B 100%);
  --ok:#2E8B5E; --ok-soft:rgba(46,139,94,.14); --warn:#C27A12; --warn-soft:rgba(194,122,18,.14); --gold:#E0B64A;
  --shadow:0 10px 30px rgba(20,33,58,.08); --shadow-lg:0 20px 50px rgba(20,33,58,.16);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
  --r:22px; --r-s:14px; --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1222; --mesh1:rgba(70,110,190,.22); --mesh2:rgba(28,170,165,.20);
    --surface:rgba(22,33,54,.62); --surface-solid:#162136; --surface-2:rgba(255,255,255,.06); --ink:#E9EFF8; --muted:#93A2BC; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --a:#8FB3F0; --a-soft:rgba(143,179,240,.16); --a-ink:#C9DAF9;
    --b:#41C8C4; --b-soft:rgba(65,200,196,.16); --b-ink:#9BEBE8;
    --grad:linear-gradient(135deg,#223F74 0%,#176A86 55%,#15A3A0 100%);
    --ok:#5FCB8E; --ok-soft:rgba(95,203,142,.16); --warn:#E8A648; --warn-soft:rgba(232,166,72,.16); --gold:#F0C65C;
    --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1222; --mesh1:rgba(70,110,190,.22); --mesh2:rgba(28,170,165,.20);
  --surface:rgba(22,33,54,.62); --surface-solid:#162136; --surface-2:rgba(255,255,255,.06); --ink:#E9EFF8; --muted:#93A2BC; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --a:#8FB3F0; --a-soft:rgba(143,179,240,.16); --a-ink:#C9DAF9;
  --b:#41C8C4; --b-soft:rgba(65,200,196,.16); --b-ink:#9BEBE8;
  --grad:linear-gradient(135deg,#223F74 0%,#176A86 55%,#15A3A0 100%);
  --ok:#5FCB8E; --ok-soft:rgba(95,203,142,.16); --warn:#E8A648; --warn-soft:rgba(232,166,72,.16); --gold:#F0C65C;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);opacity:1;will-change:transform}
.mesh .m1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:var(--mesh1);animation:drift1 26s ease-in-out infinite alternate}
.mesh .m2{width:60vmax;height:60vmax;right:-25vmax;bottom:-25vmax;background:var(--mesh2);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(8vmax,6vmax)}}
@keyframes drift2{to{transform:translate(-6vmax,-10vmax)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--b);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;z-index:1;max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 70%,transparent))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:19px}
.brand .mark{width:24px;height:24px;border-radius:8px;background:var(--grad)}
.top-right{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);display:inline-block}
.sync.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.sync.warn i{background:var(--warn)}
.icon-btn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn:active{transform:scale(.94)}
.me-pair{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}

main{flex:1;padding:4px 16px calc(104px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.tabs .in{pointer-events:auto;display:flex;width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--muted);border-radius:20px;transition:background .2s,color .2s}
.tab.on{color:var(--a-ink);background:var(--a-soft)}
.tab svg{width:22px;height:22px}
.tab:active{transform:scale(.96)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.flat{box-shadow:none}
.hero{background:var(--grad);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:28px;font-weight:800;margin-top:2px;color:#fff;position:relative}
.hero .sub{opacity:.92;font-size:14px;margin-top:4px;position:relative}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h .link,.link{font-size:13px;font-weight:700;color:var(--b-ink);background:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);border:1px solid transparent;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(20,60,100,.25)}
.btn.teal{background:var(--b);color:#fff}
.btn.navy{background:var(--a);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line-strong)}
.btn.danger{background:transparent;color:#C24B4B;border-color:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.a{background:var(--a-soft);color:var(--a-ink)}
.pill.b{background:var(--b-soft);color:var(--b-ink)}
.pill.gold{background:rgba(224,182,74,.18);color:#9A7414}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.av.a{background:var(--a)}.av.b{background:var(--b)}
.av.both{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.av.lg{width:44px;height:44px;font-size:16px}
.who{display:inline-flex;align-items:center;flex:none}
.who.sm .av{width:22px;height:22px;font-size:10px}

/* tug of war + scores */
.tug{margin-top:12px;position:relative}
.tug .bar{height:14px;border-radius:8px;background:rgba(255,255,255,.22);overflow:hidden;display:flex}
.tug .bar i{display:block;height:100%;transition:width .6s var(--spring)}
.tug .bar .ia{background:#fff}
.tug .bar .ib{background:rgba(255,255,255,.55)}
.tug .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:6px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sc .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.sc .k{font-size:12px;color:var(--muted);font-weight:600}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset .8s var(--spring)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.ring .lbl span{font-size:11px;color:var(--muted);font-family:var(--body);font-weight:600}
.pp{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.pp .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pp .bar i{display:block;height:100%;border-radius:4px;width:0;transition:width .7s var(--spring)}
.pp.a .bar i{background:var(--a)}.pp.b .bar i{background:var(--b)}
.pp .lab{font-size:13px;font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between}
.lockline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}

/* days + items */
.day{margin-bottom:10px}
.day-h{display:flex;align-items:center;gap:8px;padding:8px 4px 6px;font-weight:700;font-size:14px}
.day-h .date{color:var(--muted);font-weight:500}
.day.past .day-h{color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);position:relative;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item:last-child{border-bottom:0}
.item .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;flex:none;background:var(--surface-solid);transition:transform .15s var(--spring),background .2s,border-color .2s}
.item .check:active{transform:scale(.85)}
.item .check svg{width:16px;height:16px;stroke-width:3}
.item.done .check{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .body{flex:1;min-width:0;text-align:left}
.item .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:1px;flex-wrap:wrap}
.item .pts{font-size:12px;font-weight:800;color:var(--ok);white-space:nowrap}
.item.slipped::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
.item.slipped .check{border-color:var(--warn)}
.item.cal{background:var(--surface-2)}
.item.cal .cal-ic{border-style:dashed;color:var(--muted);background:transparent}
.item.cal .cal-ic svg{width:15px;height:15px;stroke-width:2}
.item.cal .t{font-weight:500;color:var(--muted)}
.add-row{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:13px;font-weight:700;color:var(--muted);background:transparent}
.add-row:hover{color:var(--ink)}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{color:var(--ink)}
.carry{background:var(--warn-soft);border:1px solid transparent;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.carry h3{font-size:15px;color:var(--warn);margin-bottom:6px}
.carry .c-item{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.carry .c-item .t{flex:1;font-weight:600;font-size:14px;min-width:120px}
.carry .btn{background:var(--surface-solid)}

/* workouts */
.plan-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.plan-row:last-child{border-bottom:0}
.plan-row .d{font-weight:800;color:var(--muted);font-size:13px}
.plan-row .t{font-weight:600}
.plan-row .rest{color:var(--muted);font-weight:500}
.plan-row .n{font-size:12px;color:var(--muted)}
.ex{padding:10px 12px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .t{font-weight:600}
.ex .tag{vertical-align:middle;margin-left:4px}
.demo{display:block;position:relative;width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:var(--surface-2);margin-bottom:10px;padding:0}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.f2{animation:demoflip 2.6s ease-in-out infinite}
@keyframes demoflip{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
.demo-lab{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.demo-lab i{font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(10,18,34,.62);color:#fff}
.demo-lab i:last-child{animation:demolab 2.6s ease-in-out infinite}
.demo-lab i:first-child{animation:demolab 2.6s ease-in-out infinite reverse}
@keyframes demolab{0%,44%{opacity:.35}50%,94%{opacity:1}100%{opacity:.35}}
.demo-zoom{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(10,18,34,.55);color:#fff;display:grid;place-items:center}
.demo-zoom svg{width:16px;height:16px}
.demo-big{display:grid;gap:10px;margin:8px 0}
.demo-big figure{margin:0;border-radius:16px;overflow:hidden;background:var(--surface-2);position:relative}
.demo-big img{display:block;width:100%;height:auto}
.demo-big figcaption{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(10,18,34,.65);color:#fff}
@media (prefers-reduced-motion: reduce){.demo img.f2{opacity:0}}
.strip{display:flex;gap:4px;margin-top:6px;overflow:hidden}
.strip img{width:44px;height:30px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
.notif{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--b);border-radius:var(--r);padding:14px;margin:4px 0 12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .3s ease both}
.notif.warn{border-left-color:var(--warn)}
.notif .small{color:var(--muted);margin-top:2px}
.notif-ic{width:38px;height:38px;border-radius:12px;background:var(--b-soft);color:var(--b-ink);display:grid;place-items:center;flex:none}
.notif.warn .notif-ic{background:var(--warn-soft);color:var(--warn)}
.bell{position:relative}
.bell.on{color:var(--b-ink);background:var(--b-soft)}
.bell-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface-solid)}
.bell-slash{position:absolute;width:22px;height:2px;background:currentColor;transform:rotate(-45deg);border-radius:2px;text-decoration:none}
.brand,.me-pair{white-space:nowrap}
.top-right{flex:none}
@media (max-width:440px){.sync #syncText{display:none}.brand{font-size:18px}.top{gap:8px}.top-right{gap:6px}.icon-btn{width:36px;height:36px}}
.who.duo{gap:3px}
.who.duo .av{width:22px;height:22px;font-size:10px}
.who.duo .av svg{width:12px;height:12px;stroke-width:3.4}
.who.duo .av.wait{opacity:.38}
.who.duo .av.fin{background:var(--ok)}
.item.half .check{background:var(--ok);border-color:var(--ok);color:#fff}
.item.half .t{color:var(--ink)}
.pick[disabled]{cursor:default}
.pick[disabled] .box{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.sheet-wrap.open ~ .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px)}
.sheet-wrap.open ~ .toast.show{transform:translateX(-50%)}
.exn{width:22px;height:22px;border-radius:50%;background:var(--a-soft);color:var(--a-ink);font-size:12px;font-weight:800;display:inline-grid;place-items:center;flex:none;margin-top:1px}
.minibars{display:flex;gap:6px;align-items:flex-end;height:44px}
.minibars .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap}
.minibars .mb i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--surface-2);position:relative;overflow:hidden}
.minibars .mb i b{position:absolute;left:0;right:0;bottom:0;background:var(--b);border-radius:5px 5px 2px 2px}

/* home: projects + kitchen */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.proj-h{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.proj-h h3{font-size:16px;flex:1;min-width:0}
.proj-h .chev{color:var(--muted);transition:transform .2s}
.proj.open .proj-h .chev{transform:rotate(180deg)}
.proj-meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px;font-size:13px;color:var(--muted);align-items:center}
.prog{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:0 14px 12px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:4px}
.proj-body{border-top:1px solid var(--line);display:none}
.proj.open .proj-body{display:block}
.status{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.status.idea{background:var(--surface-2);color:var(--muted)}
.status.planned{background:var(--a-soft);color:var(--a-ink)}
.status.active{background:var(--b-soft);color:var(--b-ink)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.meal-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.meal-row:last-child{border-bottom:0}
.meal-row .d{font-weight:800;color:var(--muted);font-size:13px}
.meal-row .t{font-weight:600}
.meal-row .none{color:var(--muted);font-weight:500}
.meal-row.done .t{color:var(--muted);text-decoration:line-through}
.groc-add{display:flex;gap:8px;margin-bottom:10px}
.groc-add input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink);border:1px solid transparent}
.chip.on{background:var(--a);color:#fff}
.chip.b.on{background:var(--b)}
.subnav{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin:4px 0 12px}
.subnav button{flex:1;padding:9px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.subnav button.on{background:var(--a-soft);color:var(--a-ink)}

/* dates */
.idea{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .t{flex:1;font-weight:600;min-width:0;text-align:left}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.memory{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.memory:last-child{border-bottom:0}
.memory .t{font-weight:600}
.memory .d{font-size:12px;color:var(--muted)}
.memory .memo{font-size:14px;margin-top:3px}

/* team */
.wager{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.wager .stake{font-family:var(--display);font-size:20px;font-weight:800;margin:4px 0 8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.vs .side{text-align:center}
.vs .side .pct{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.vs .side .pts{font-size:12px;color:var(--muted);font-weight:600}
.vs .mid{font-family:var(--display);font-weight:800;color:var(--muted);font-size:14px}
.vs .side.lead .pct{color:var(--ok)}
.pot{background:var(--grad);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-lg)}
.pot .v{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.pot .track{height:10px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.pot .track i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .7s var(--spring)}
.reward{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:0}
.reward .t{flex:1;font-weight:600;min-width:0}
.reward .cost{font-weight:800;color:var(--muted);white-space:nowrap}
.reward.ready .cost{color:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;font-size:12px;font-weight:700}
.badge .ic{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--grad);color:#fff}
.badge .ic svg{width:20px;height:20px}
.badge.locked{opacity:.45}
.badge.locked .ic{background:var(--surface-2);color:var(--muted)}
.badge .n{color:var(--muted);font-weight:600;font-size:11px}
.feed{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.feed:last-child{border-bottom:0}
.feed .t{font-size:14px}
.feed .d{font-size:12px;color:var(--muted)}
.feed .hf{margin-left:auto;flex:none;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted)}
.feed .hf.on{background:var(--b-soft);color:var(--b-ink)}
.open-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.open-row:last-child{border-bottom:0}
.open-row .t{flex:1;font-weight:600;font-size:14px}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .bar{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--grad);border-radius:4px}

label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=number],input[type=time],input[type=password],select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface-solid);font-size:16px}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface-solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button.on.a{color:var(--a-ink)}.seg button.on.b{color:var(--b-ink)}
.daychips{display:flex;gap:5px}
.daychips button{flex:1;padding:9px 0;border-radius:11px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--muted)}
.daychips button.on{background:var(--a);color:#fff}
.daychips button.today{box-shadow:inset 0 0 0 2px var(--b)}
.form-actions{display:flex;gap:8px;margin-top:18px}
.form-actions .btn{flex:1}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.tgl:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--b)}.sw.on::after{left:21px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:none}
.sheet-wrap.open{display:block}
.sheet-wrap .dim{position:absolute;inset:0;background:rgba(8,14,28,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .28s var(--spring)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 12px}
.sheet h2{font-size:21px;margin-bottom:2px}
.sheet .lead{color:var(--muted);font-size:14px;margin-bottom:6px}
.steps{display:flex;gap:4px;margin:8px 0 14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps i.on{background:var(--b)}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pick:last-child{border-bottom:0}
.pick .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;flex:none}
.pick.on .box{background:var(--a);border-color:var(--a);color:#fff}
.pick .box svg{width:14px;height:14px;stroke-width:3}
.pick .t{flex:1;font-weight:600;min-width:0}
.pick select{width:auto;padding:6px 8px;font-size:13px;border-radius:8px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.summary .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.summary .k{font-size:12px;color:var(--muted);font-weight:700}
.summary .v{font-family:var(--display);font-size:26px;font-weight:800}

/* celebration */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.22s var(--spring);z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
.fly{position:fixed;z-index:26;pointer-events:none;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ok);text-shadow:0 2px 8px rgba(0,0,0,.15);animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-70px) scale(1);opacity:0}}
.share-card{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.mesh i{animation:none!important}}

function plannerCommit() {

    const onBoard = weekItems(wk).filter(it => it.area === 'workout');
    if (pn) { const wplan = programWeekPlan(pn); Object.entries(P.w).forEach(([d, on]) => { const p = wplan[Number(d)]; if (!on || !p || p.key === 'rest' || onBoard.some(it => it.day === Number(d))) return; Store.write('items', uid(), programItem(p, pn, wk, n++)); }); }
    else Object.entries(P.w).forEach(([d, on]) => { if (!on || !pl[d]) return; if (onBoard.some(it => it.day === Number(d))) return; Store.write('items', uid(), { area: 'workout', title: pl[d].title, who: pl[d].who || 'both', week: wk, day: Number(d), notes: pl[d].note || '', done: false, doneAt: null, doneBy: null, createdAt: nowStamp() + n++, createdBy: S.me || 'a' }); });
  } else if (P.step === 1 && P.m) {

    });

    Object.entries(P.h).forEach(([id, dv]) => { if (S.items[id]) Store.patch('items', id, { week: wk, day: dv === 'any' ? null : Number(dv) }); });

    case 'session-remove': { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Tap again to remove'; break; } const it = S.items[id]; Store.del('items', id); Object.entries(S.feed).forEach(([fid, f]) => { if (f.itemId === id) Store.del('feed', fid); }); closeSheet(); toast((it ? it.title : 'Workout') + ' removed. Re-add it from the Workouts tab any time.'); break; }
    case 'session-save': saveSessionLog(id); toast('Saved'); break;
    case 'session-done': { const it = S.items[id]; if (!it) break; const mine = {}; $('#sheet').querySelectorAll('.exlog').forEach(inp => { const v = inp.value.trim(); if (v) mine[inp.dataset.ex] = v; }); const log = Object.assign({}, it.log || {}); if (Object.keys(mine).length) log[me()] = mine; closeSheet(); Store.patch('items', id, { log }); toggleItem(id, null); break; }
    case 'program-start': setProgram({ programStart: S.viewWeek, programPaused: false }); toast('Week 1 starts ' + weekLabel(S.viewWeek).toLowerCase()); break;
    case 'program-apply': applyProgram(S.viewWeek); closeSheet(); break;
    case 'program-menu': programMenuSheet(); break;
    case 'program-pause': setProgram({ programPaused: true }); closeSheet(); break;
    case 'program-resume': setProgram({ programPaused: false }); closeSheet(); break;
    case 'program-back': setProgram({ programStart: shiftWeek(programStart(), 1) }); closeSheet(); toast('This week repeats'); break;
    case 'program-restart': { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Really restart? Tap again'; break; } setProgram({ programStart: currentWeekKey(), programPaused: false }); closeSheet(); toast('Back to week 1'); break; }
    case 'standing-toggle': S.showStanding = !S.showStanding; render(); break;
    case 'plan-edit': planEditSheet(Number(el.dataset.day)); break;
    case 'plan-save': savePlanDay(Number(el.dataset.day), false); break;
    case 'plan-rest': savePlanDay(Number(el.dataset.day), true); break;
    case 'plan-apply': applyPlan(S.viewWeek); break;
    case 'proj-new': projectSheet(null); break;
    case 'proj-edit': projectSheet(Object.assign({ id }, S.projects[id])); break;
    case 'proj-save': saveProject(id || null); break;
    case 'proj-delete': { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Really delete? Tap again'; break; } projTasks(id).forEach(t => Store.del('items', t.id)); Store.del('projects', id); closeSheet(); toast('Project deleted'); break; }
    case 'proj-toggle': S.openProj = S.openProj === id ? null : id; render(); break;
    case 'task-add': taskSheet(id); break;
    case 'task-save': saveTask(el.dataset.pid); break;
    case 'idea-new': itemSheet(null, { area: 'date', week: null, day: null, who: 'both' }); break;
    case 'idea-pick': pickSheet(id); break;
    case 'idea-surprise': { const jar = live().filter(it => it.area === 'date' && !it.week && !it.done); if (jar.length) pickSheet(jar[Math.floor(Math.random() * jar.length)].id); break; }
    case 'pick-save': { const root = $('#sheet'), dv = segVal(root, 'day'), wkV = segVal(root, 'week'); Store.patch('items', id, { week: wkV, day: dv === 'any' || dv == null ? null : Number(dv) }); closeSheet(); toast('On the board'); break; }
    case 'memo': memoSheet(id); break;
    case 'memo-save': Store.patch('items', id, { memo: $('#sheet').querySelector('#memo').value.trim() }); closeSheet(); break;
    case 'meal-edit': mealSheet(Number(el.dataset.day)); break;
    case 'meal-save': saveMeal(Number(el.dataset.day), id || null); break;
    case 'groc-toggle': { const g = S.grocery[id]; if (g) Store.patch('grocery', id, { done: !g.done }); break; }
    case 'groc-clear': Object.entries(S.grocery).forEach(([gid, g]) => { if (g.done) Store.del('grocery', gid); }); break;
    case 'stake': stakeSheet(); break;
    case 'stake-save': saveStake(el.dataset.week); break;
    case 'reward-new': rewardSheet(null); break;
    case 'reward-edit': rewardSheet(id); break;
    case 'reward-save': saveReward(id || null); break;
    case 'reward-delete': { const list = rewards().filter(r => r.id !== id); Store.write('settings', 'main', Object.assign({}, S.settings.main || {}, { rewards: list })); closeSheet(); break; }
    case 'reward-claim': claimReward(id); break;
    case 'nudge': nudgeSheet(id); break;
    case 'nudge-send': sendNudge(id, el.dataset.to); break;
    case 'highfive': highFive(id, el.dataset.to, el.dataset.title); break;
    case 'review': reviewSheet(el.dataset.week); break;
    case 'review-share': shareReview(el.dataset.week); break;
    case 'push-on': { const fromSettings = !!el.closest('#sheet'); Push.enable().then(() => { if (fromSettings && Push.state === 'on') settingsSheet(); }); break; }
    case 'push-off': Push.disable().then(() => settingsSheet()); break;
    case 'push-test': Push.test(); break;
    case 'bell': bellSheet(); break;
    case 'push-off-quick': Push.disable().then(() => closeSheet()); break;
    case 'push-retry': closeSheet(); Push.init().then(() => { if (Push.state === 'ready') Push.enable(); else if (Push.state === 'denied') toast('Still blocked. Check the Home Team switch in Settings.'); }); break;
    case 'notif-install': installSheet(); break;
    case 'notif-denied': deniedSheet(); break;
    case 'notif-snooze': lsSet(NOTIF_SNOOZE, String(Date.now() + 3 * 86400e3)); render(); toast('Okay. The bell up top turns them on any time.'); break;
    case 'backup': { try { const o = {}; COLLS.forEach(k => { o[k] = S[k]; }); navigator.clipboard.writeText(JSON.stringify(o)).then(() => toast('Backup copied'), () => toast("Couldn't copy here")); } catch (err) { toast("Couldn't copy here"); } break; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="groc"]'); if (!f) return; e.preventDefault();
  const inp = f.querySelector('#grocInput'), text = inp.value.trim(); if (!text) return;
  Store.write('grocery', uid(), { text, done: false, addedBy: me(), createdAt: nowStamp() }); inp.value = ''; inp.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET) closeSheet(); });

/* ---------- boot ---------- */
S.me = lsGet('home-team-me') || null;
S.tab = lsGet('home-team-tab') || 'week';
if (!['week', 'team', 'workouts', 'home', 'dates'].includes(S.tab)) S.tab = 'week';
const hashTab = (location.hash || '').replace('#', ''); if (['week', 'team', 'workouts', 'home', 'dates'].includes(hashTab)) S.tab = hashTab;
setSync(); render();
Store.init();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); }); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.loaded) { Store.refresh(); if (S.tab === 'week') Cal.load(S.viewWeek, true); } });
window.addEventListener('hashchange', () => { const t = (location.hash || '').replace('#', ''); if (['week', 'team', 'workouts', 'home', 'dates'].includes(t)) { S.tab = t; render(); } });
</script>
</body>
</html>
